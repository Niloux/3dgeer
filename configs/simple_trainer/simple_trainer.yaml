preset: default

# Generated for examples/simple_trainer.py.
data_dir: "/home/wuyou/3dgeer/data/park"
# data_dir: "/home/wuyou/3dgeer/data/park_colmap"
data_factor: 4
frame_id_min: 63
frame_id_max: 187
test_every: 8
use_test_split: false
normalize_world_space: false
log_every: 100
log_loss_window: 100

result_dir: results/0828/geometry
disable_viewer: true
disable_video: true

camera_model: fisheye
keep_distortion: true
max_fisheye_fov: 160

max_steps: 15000
eval_steps: [3000, 7000, 10000, 15000, 30000]
save_steps: [3000, 7000, 10000, 15000, 30000]
save_ply: true
ply_steps: [3000, 7000, 10000, 15000, 30000]

sh_degree: 2
# Keep the full SH representation for training, but save only the DC term in PLY.
ply_sh_degree: 0
ssim_lambda: 0.2
with_geer: true
with_ut: false
with_eval3d: true

init_type: lidar
init_lidar_path: "/home/wuyou/3dgeer/data/park/lidar.ply"
init_opa: 0.1
init_scale: 1.0
init_use_knn_pca: true
knn_pca_k: 24
knn_pca_normal_scale_factor: 0.25
knn_pca_planarity_threshold: 0.30
knn_pca_curvature_threshold: 0.10

# Penalize the expected Gaussian distance to nearby LiDAR surface planes.
geometry_enabled: false
geometry_lambda: 0.10

sky_enabled: true
sky_mask_dir: semantic_masks/sky
sky_num_points: 100000
sky_radius: 10000.0
sky_initial_opacity: 0.7
sky_sh0_lr: 0.0025
sky_shN_lr: 0.000125
sky_alpha_lambda: 0.1

opacity_reg: 0.0
scale_reg: 0.0

strategy:
  absgrad: true
  grow_grad2d: 1e-4
  grow_scale2d: 0.03
  max_gaussians: 5000000
  max_grow_per_refine: 100000
  refine_stop_iter: 27000
  refine_scale2d_stop_iter: 27000

# Let the lightweight per-image color gains stabilize before adding Gaussians.
densification_start_step: 500

pose_opt: true
pose_opt_start_step: 500
pose_opt_lr: 1.0e-4

calib_opt: true
calib_opt_reg: 1e-6

app_opt: false

use_bilateral_grid: true
bilateral_grid_shape: [16, 16, 8]
